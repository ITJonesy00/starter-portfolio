# Simple workflow for deploying static content to GitHub Pages
# build > prepare-release

name: Run pipeline test [build, prepare-release]

env:
  SITE_DIR: "portfolio"
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  MAJOR: 1 # test
on:
  # Runs on pushes targeting the default branch
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1- Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 2- Setup Pages
        uses: actions/configure-pages@v6
      - name: 3- Write version.json file
        run: |
          jq -n --arg v "$VERSION" '{version: $v}' > "$SITE_DIR/version.json"
      
  prepare-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Lead the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$MAJOR.${{ github.run_number }}"
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run deploy.yml --ref "$TAG"
